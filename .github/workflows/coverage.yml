# Runs the containment suite with coverage on every PR and on main, as d1pres does; octocov
# (.octocov.yml) turns the profile into one comment on the PR, edited in place on each push, and the
# run's summary.
#
# On a PR the comment has a Patch Coverage column: of this PR's changed lines, how many a test runs.
# Its coverage links open a page (an artifact) of the PR's changed hunks with each line's coverage
# beside them. The page and the comparison need a report from main to compare against, which the
# first run on main after this merges stores.
#
# The suite runs lab-broker and lab-run as built binaries (cmd/lab-broker/main_test.go), which go
# test's profile cannot see. With WAC_COVERDIR set, the suite builds them with -cover and each run
# writes what it ran there; the merge step adds that to the profile.
#
# The coverage gate (.github/coverage-gate, d1pres's, unchanged) fails the run when total statement
# coverage is under 60%, or when any file with statements has none covered: a 0% file fails outright.
# It prints every file, worst first, in the job summary.
#
# A failing test fails the suite step itself, so the red step is the one whose log names the test; on
# a PR the failing tests are also posted as a comment. octocov still reports what ran.
#
# Three jobs: the suite needs Windows (the broker's named pipe, impersonation, Windows paths), octocov
# runs on Linux from the uploaded profile, and the WSL side (wsl/, its own module: the edit hook and
# the static lab-run wrapper) is tested on Linux, as install.sh does. Private
# repository minutes count twice on Windows. Actions, Go and the octocov binary are pinned.
name: coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the comments
  actions: write # octocov's report artifacts, and deleting a PR's superseded pages

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # Git Bash on the runner; -eo pipefail, so the step fails when go test does
    steps:
      # The runner context is not available in a job's env, so the coverage directory is set here,
      # as the Windows path go.exe and the built binaries read.
      - name: coverage directory
        run: |
          echo "WAC_COVERDIR=$RUNNER_TEMP\\wac-covdata" >> "$GITHUB_ENV"
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/wac-covdata"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false

      - name: gofmt and vet
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt would change:"; echo "$unformatted"; exit 1; fi
          go vet ./...

      # The owner's install scripts are not Go, so the profile does not see them; at least both must
      # parse, in Windows PowerShell 5.1 (what install.ps1 is written for) and in PowerShell 7.
      - name: install scripts parse (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem install -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($file.Name): $e"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: install scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem install -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($file.Name): $e"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: containment suite with coverage
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./... 2>&1 | tee "$RUNNER_TEMP/suite.txt"

      # What the suite ran as subprocesses, into the one profile octocov and the gate read. The block
      # keys are the same as go test's, so a block both saw is one block.
      - name: add the subprocesses' coverage
        run: |
          go tool covdata textfmt -i="$WAC_COVERDIR" -o "$RUNNER_TEMP/subprocesses.out"
          tail -n +2 "$RUNNER_TEMP/subprocesses.out" >> coverage.out

      - name: coverage gate (60% total, no file at 0%)
        working-directory: .github/coverage-gate
        run: go run . -min 60 "$GITHUB_WORKSPACE/coverage.out"

      # The failing tests as a PR comment, readable without the job log.
      - name: post the failing tests on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/suite.txt" ] || exit 0
          grep -E -A12 '^--- FAIL|^panic:|\[(build|setup) failed\]' "$RUNNER_TEMP/suite.txt" | head -150 > "$RUNNER_TEMP/fails.txt" || exit 0
          [ -s "$RUNNER_TEMP/fails.txt" ] || exit 0
          { echo "**containment suite failed** (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"; echo '```'; cat "$RUNNER_TEMP/fails.txt"; echo '```'; } > "$RUNNER_TEMP/fails.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/fails.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('coverage.out') != ''
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 7

  wsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wsl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false
      - name: gofmt, vet and tests (the edit hook, the lab-run wrapper)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt would change:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test -count=1 ./...
      - name: install.sh and uninstall.sh into a scratch root
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat >/dev/null # install.sh checks the sandbox's two tools
          root="$RUNNER_TEMP/root"
          printf '#!/bin/sh\n' > "$RUNNER_TEMP/lab-run.exe" && chmod +x "$RUNNER_TEMP/lab-run.exe"
          ROOT="$root" WINDOWS_LABRUN="$RUNNER_TEMP/lab-run.exe" bash install.sh
          test -x "$root/usr/local/bin/lab-run"
          ROOT="$root" bash uninstall.sh

  report:
    needs: suite
    if: always() && needs.suite.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: profile
        continue-on-error: true # no profile when the suite did not build
        with:
          name: coverage-profile
      # The report is information, not a gate (the gate is the suite job's coverage step). Storing it
      # in the artifact datastore timed out on GitHub's side (deadline_exceeded, #16), and that turned
      # the pull request red with every test passing.
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        if: steps.profile.outcome == 'success'
        continue-on-error: true
        with:
          version: v0.83.0
          checksum: 53b56852dd9f8a9f9a534e2b814647d7e1629c5192344184a3cc3a1f26804b3b # octocov_v0.83.0_linux_amd64.tar.gz
